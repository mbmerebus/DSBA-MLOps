services:
  redis-auth:
    image: redis:7-alpine
    container_name: redis-auth
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-auth-data:/data
    command: redis-server /usr/local/etc/redis/redis.conf

  redis-history:
    image: redis:7-alpine
    container_name: redis-history
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-history-data:/data
    command: redis-server /usr/local/etc/redis/redis.conf

  auth:
    build: ./src/auth
    container_name: auth
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis-auth
    depends_on:
      - redis-auth

  scoring-api:
    build: ./src/scoring
    container_name: scoring-api
    ports:
      - "8000:8000"
    volumes:
      - ./src/scoring/model_storage:/app/model_storage

  gateway:
    build: ./src/gateway
    container_name: gateway
    ports:
      - "8002:8002"
    environment:
      - AUTH_SERVICE_URL=http://auth:8001
      - SCORING_SERVICE_URL=http://scoring-api:8000
      - HISTORY_SERVICE_URL=http://history:8003
    depends_on:
      - auth
      - scoring-api
      - history

  webui:
    build: ./src/webui
    container_name: webui
    ports:
      - "3000:80"
    depends_on:
      - gateway
      - auth

  history:
    build: ./src/history
    container_name: history
    ports:
      - "8003:8003"
    environment:
      - REDIS_HOST=redis-history
    depends_on:
      - redis-history

volumes:
  redis-auth-data:
  redis-history-data: